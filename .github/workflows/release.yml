name: Build and release

on:
  push:
    branches: [spaceport]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build
        run: ./gradlew build
      - name: Pick the proxy jar
        run: |
          jar=$(ls proxy/build/libs/*.jar | grep -vE -- '-(sources|javadoc|plain)\.jar$' | xargs ls -S | head -1)
          cp "$jar" spaceport.jar
      - uses: actions/upload-artifact@v4
        with:
          name: spaceport-jar
          path: spaceport.jar

  # Publishing is a separate job with write access that runs no build tooling.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spaceport-jar
      # Every push to spaceport refreshes the "dev" pre-release with the newest jar.
      - name: Update dev build
        if: github.ref == 'refs/heads/spaceport'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=${GITHUB_SHA::8}
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev spaceport.jar --prerelease --target "$GITHUB_SHA" \
            --title "Dev build $sha" --notes "Latest build of the spaceport branch ($sha). Not a stable release."
      # Pushing a tag like v1.2.0 makes a normal release with the jar attached.
      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" spaceport.jar --title "Spaceport $GITHUB_REF_NAME" --generate-notes
