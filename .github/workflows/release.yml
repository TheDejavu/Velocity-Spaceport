name: Build and release

# Like Velocity's downloads: every push to spaceport is a numbered build with the proxy jar attached.
on:
  push:
    branches: [spaceport]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build
        run: ./gradlew build
      - name: Name the proxy jar
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          jar=$(ls proxy/build/libs/*.jar | grep -vE -- '-(sources|javadoc|plain)\.jar$' | xargs ls -S | head -1)
          mkdir out && cp "$jar" "out/spaceport-$version-$GITHUB_RUN_NUMBER.jar"
          echo "$version" > out/version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: spaceport-jar
          path: out/

  # Publishing is a separate job with write access that runs no build tooling.
  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spaceport-jar
      - name: Publish build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(cat version.txt)
          n=$GITHUB_RUN_NUMBER
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true   # old rolling release from the first setup
          gh release create "build-$n" spaceport-*.jar --target "$GITHUB_SHA" --latest \
            --title "Spaceport $version build $n" \
            --notes "Build $n of spaceport (${GITHUB_SHA::8}). Download the jar and run it like Velocity: java -jar spaceport-$version-$n.jar"
